services:
  db:
    image: postgres:16
    container_name: video_game_db
    restart: always
    environment:
      POSTGRES_DB: videogames_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videogames_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: video_game_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/videogames_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
